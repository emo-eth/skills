# Prefer `smart-home setup --username EMAIL --password-stdin`.
# Copy to ~/.config/smart-home/config.toml and chmod 600 if you edit by hand.
# Never commit a filled copy. Keychain does not work from agent/sudo sessions.

default_connector = "kasa"

[kasa]
username = "you@example.com"
# Exactly one password source:
password_env = "SMART_HOME_KASA_PASSWORD"
# password_op = "op://Personal/TP-Link/password"
# password_keychain = "smart-home.kasa"
# password_encoding = "plain"  # or "md5"
# url = "https://wap.tplinkcloud.com"
# Extra /24s to TCP-probe for KLAP (studio also always scans ASUS guest
# 192.168.101.0/24 and 192.168.102.0/24). Needed when plugs sit on an isolated SSID.
# scan_cidrs = ["192.168.101.0/24", "192.168.102.0/24"]

# Optional second backend when a Home Assistant box can see the IoT VLAN.
# [homeassistant]
# url = "http://ha.example:8123"
# token_env = "SMART_HOME_HA_TOKEN"
# token_op = "op://Personal/Home Assistant/token"

# Kasa app names: Sparks, PC, 4090, Mac Studio, Media Rack.
# spark0 and spark1 share one KP125M ("Sparks"); cycling it reboots both.
# SMART.KASAPLUG needs host = "IP" for unicast KLAP (no UDP discover).

[[device]]
alias = "spark0"
connector = "kasa"
match = "Sparks"
allow_cycle = true

[[device]]
alias = "spark1"
connector = "kasa"
match = "Sparks"
allow_cycle = true

[[device]]
alias = "emo-win"
connector = "kasa"
match = "PC"
allow_cycle = true

[[device]]
alias = "emo-4090"
connector = "kasa"
match = "4090"
allow_cycle = true

[[device]]
alias = "mac-studio"
connector = "kasa"
match = "Mac Studio"
allow_cycle = false       # this machine's own plug

[[device]]
alias = "media-rack"
connector = "kasa"
match = "Media Rack"
allow_cycle = false
host = "192.168.50.152"   # KP125M SMART.KASAPLUG via KLAP :80

# `smart-home scan` also writes ~/.config/smart-home/hosts.toml
# (alias / deviceId / MAC -> IP). Prefer that over duplicating IPs here.

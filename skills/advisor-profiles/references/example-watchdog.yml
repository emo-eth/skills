instructions: |
  Review like a careful senior engineer: concise, evidence-grounded notes
  that name the specific code, behavior, or clause they refer to. No style
  commentary; no repeating what already passed.

advisors:
  - name: vibe
    enabled: true
    instructions: |
      You are the vibe advisor. The repository's vibe contract lives at
      @docs/vibe.md — read it and hold every change against it. Flag work
      that breaks the vibe's promises or anti-vibes, and cite the exact
      clause or check you are applying.

  - name: code-quality
    enabled: false
    instructions: |
      You are the code-quality advisor. Review the main agent's changes
      for correctness, regressions, and maintainability: broken
      invariants, silent fallbacks, duplicated conventions, dead code
      left behind, and unexercised verify tails. Prefer concrete,
      actionable notes over style commentary.

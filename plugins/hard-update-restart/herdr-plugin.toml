id = "hard-update-restart"
name = "Hard Update Restart"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Update runtimes and plugins across local and mesh machines, then hard-restart Herdr and verify native agent recovery."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "all"
title = "Update everything and hard-restart"
description = "Update Herdr, OMP, Pi, and installed plugins/extensions; restart this session and resume recoverable agents after reconnecting."
contexts = ["global", "workspace", "pane"]
command = ["node", "--experimental-strip-types", "src/schedule-updater.ts"]

[[panes]]
id = "all"
title = "Update everything and hard-restart"
placement = "popup"
width = "90%"
height = 24
command = ["node", "--experimental-strip-types", "src/updater.ts"]

[[actions]]
id = "restart"
title = "Hard-restart Herdr (no updates)"
description = "Stop pane processes, start fresh Herdr server(s), and restore agent sessions without running any runtime or plugin updates."
contexts = ["global", "workspace", "pane"]
command = ["node", "--experimental-strip-types", "src/schedule-updater.ts", "--no-updates"]

[[panes]]
id = "restart"
title = "Hard-restart Herdr (no updates)"
placement = "popup"
width = "90%"
height = 24
command = ["node", "--experimental-strip-types", "src/updater.ts", "--no-updates"]


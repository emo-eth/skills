id = "hard-update-restart"
name = "Hard Update Restart"
version = "0.3.1"
min_herdr_version = "0.9.0"
description = "Update runtimes and plugins across local and mesh machines, then hard-restart Herdr server and client. Custom herdr binaries are never overwritten."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "all"
title = "Update everything and hard-restart"
description = "Update OMP, Pi, and plugins; skip herdr update for custom binaries; restart the Herdr server and client; resume recoverable agents."
contexts = ["global", "workspace", "pane"]
command = ["node", "--experimental-strip-types", "src/schedule-updater.ts"]

[[panes]]
id = "all"
title = "Update everything and hard-restart"
placement = "popup"
width = "90%"
height = 24
command = ["node", "--experimental-strip-types", "src/updater.ts"]

[[actions]]
id = "restart"
title = "Hard-restart Herdr (no updates)"
description = "Stop the Herdr server and TUI client, start a replacement server, open a new client window, and restore agent sessions without updating runtimes or plugins."
contexts = ["global", "workspace", "pane"]
command = ["node", "--experimental-strip-types", "src/schedule-updater.ts", "--no-updates"]

[[panes]]
id = "restart"
title = "Hard-restart Herdr (no updates)"
placement = "popup"
width = "90%"
height = 24
command = ["node", "--experimental-strip-types", "src/updater.ts", "--no-updates"]


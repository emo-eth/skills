id = "ticket-bound-attention"
name = "Ticket-bound attention"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Create or bind a Linear ticket when a worktree is created or opened. Human names, no form."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "capture"
title = "Capture Linear ticket"
description = "Create or bind a Linear ticket for this worktree. Idempotent. Human names."
contexts = ["global", "workspace", "pane"]
command = ["node", "--experimental-strip-types", "src/main.ts", "capture"]

[[events]]
on = "worktree.created"
command = ["node", "--experimental-strip-types", "src/main.ts", "capture"]

[[events]]
on = "worktree.opened"
command = ["node", "--experimental-strip-types", "src/main.ts", "capture"]

[[actions]]
id = "desk"
title = "Desk"
description = "List open chairs versus bound tickets and flag orphans."
contexts = ["global", "workspace", "pane"]
command = ["node", "--experimental-strip-types", "src/main.ts", "desk"]

[[actions]]
id = "shelve"
title = "Shelve"
description = "Hide this chair. Never remove the tree. Write a sitting note if dirty or working."
contexts = ["workspace", "pane"]
command = ["node", "--experimental-strip-types", "src/main.ts", "shelve"]

[[actions]]
id = "funeral"
title = "Funeral"
description = "Remove this tree only when Linear is Done, git is clean, and any Done/Acceptance/Validation lists are operator-approved. Does not mark Linear Done."
contexts = ["workspace", "pane"]
command = ["node", "--experimental-strip-types", "src/main.ts", "funeral"]

[[actions]]
id = "rank"
title = "Rank to desk"
description = "Propose sit versus hide from Linear priorities written by prioritize-linear-tickets. Does not open or close chairs."
contexts = ["global", "workspace", "pane"]
command = ["node", "--experimental-strip-types", "src/main.ts", "rank"]

